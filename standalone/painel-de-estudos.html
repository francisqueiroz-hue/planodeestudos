<title>Painel de Estudos</title>
<meta name="description" content="Plataforma pessoal de estudos do 8º ano com foco em Matemática.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Visual único e escuro, escolhido de propósito: cores definidas explicitamente para qualquer tema do visualizador. */
:root{color-scheme:dark;--bg:#0b0c10;--surface:#15161c;--tile:#1d1f27;--tile-hi:#262833;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--text:#f2f3f7;--dim:#9295a4;--accent:#6d7bff;--accent-2:#a797ff;--ok:#6fdca0;--bad:#ff8b97;--warn:#f1cc72;--font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
a{color:var(--accent-2);text-decoration:none}a:hover{text-decoration:underline}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,12,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand b{display:block;font-size:17px;letter-spacing:-.02em}.brand small{color:var(--dim);font-size:12px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-2));font-weight:800;font-size:18px}
.score{text-align:right}.score b{font-family:var(--mono);font-size:16px}.score small{display:block;color:var(--dim);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs button{flex:none;border:1px solid transparent;background:none;color:var(--dim);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--text);color:var(--bg)}.tabs button:hover:not(.on){color:var(--text);border-color:var(--line-2)}
main{display:flex;flex-direction:column;gap:18px;padding-top:22px}
.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.08;letter-spacing:-.035em;margin:0;text-wrap:balance}
.dim{color:var(--dim)}.hero .lead{color:var(--dim);font-size:16px;max-width:62ch;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}.stat span{color:var(--dim);font-size:13px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.actions,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.center{justify-content:center}
.primary,.secondary,.ghost{border-radius:999px;font-weight:700;padding:11px 20px;border:1px solid transparent}
.primary{background:var(--text);color:var(--bg)}.secondary{background:var(--tile-hi);border-color:var(--line-2)}.ghost{background:none;border-color:var(--line-2);color:var(--dim)}
.small{padding:7px 14px;font-size:13px}.small-link{font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.center{align-items:center;text-align:center;padding:28px 20px}
.card h2{margin:0;font-size:22px;letter-spacing:-.02em}.card h3{margin:0;font-size:17px;letter-spacing:-.01em}
.topic .dim{font-size:13px;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.meter{height:6px;border-radius:9px;background:var(--tile-hi);overflow:hidden}.meter div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:9px}
.q{gap:12px}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.lvl,.tag{border-radius:999px;padding:2px 9px;border:1px solid var(--line-2);font-size:11px}.lvl.l1{color:var(--ok)}.lvl.l2{color:var(--warn)}.lvl.l3{color:var(--bad)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.prompt{margin:0;font-size:17px;font-weight:600;line-height:1.45}.prompt.big{font-size:clamp(18px,2.4vw,22px);text-align:center}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--line-2);background:#101117;line-height:1.4}
.opt:hover:not(:disabled){border-color:rgba(167,151,255,.6)}.opt:disabled{opacity:1;cursor:default}
.opt.on{border-color:var(--accent-2);background:rgba(167,151,255,.12)}.opt.right{border-color:var(--ok);background:rgba(111,220,160,.12)}.opt.wrong{border-color:var(--bad);background:rgba(255,139,151,.1)}
.l{flex:none;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--tile-hi);font-family:var(--mono);font-size:12px}
.opt.on .l{background:var(--accent-2);color:var(--bg)}.opt.right .l{background:var(--ok);color:var(--bg)}.opt.wrong .l{background:var(--bad);color:var(--bg)}
.q>.primary{align-self:flex-start}
.feedback{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--tile);border:1px solid var(--line)}.feedback p{margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.feedback .ok,.feedback .bad{color:var(--text)}.feedback .ok b{color:var(--ok)}.feedback .bad b{color:var(--bad)}
.feedback>button{justify-self:start}
.explain-wrap{display:grid;gap:8px}.explain{white-space:pre-wrap;color:#d6d8e3;font-size:14px;line-height:1.55}.explain:empty{display:none}
.links{display:grid;gap:4px;font-size:13px}
.runner{max-width:680px;width:100%;align-self:center;gap:14px}.run-top{display:flex;justify-content:space-between;gap:8px}
.runner>.primary{align-self:center}
.field-label{display:grid;gap:6px;font-size:13px;color:var(--dim);text-align:left}
select,textarea{background:#101117;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;max-width:100%}
textarea{width:100%;resize:vertical}
.filters select{flex:1 1 180px}
.stack{display:flex;flex-direction:column;gap:14px}.stack>.ghost{align-self:center}
.empty{color:var(--dim);text-align:center;padding:30px;border:1px dashed var(--line-2);border-radius:18px;margin:0}
.results{list-style:none;padding:0;margin:0;display:grid;gap:8px;width:100%;text-align:left}
.results li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--tile);border-left:3px solid var(--bad);font-size:14px}.results li.ok{border-color:var(--ok);color:var(--text)}.results li.bad{color:var(--text)}.results span{color:var(--dim)}
.bims{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bim{display:grid;gap:8px;align-content:start;background:var(--tile);border-radius:16px;padding:12px}
.bim h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ptopic{display:grid;gap:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03)}
.ptopic label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.ptopic input{margin-top:4px;accent-color:var(--accent-2)}
.ptopic.done b{text-decoration:line-through;color:var(--dim)}
.ptopic details{font-size:13px}.ptopic summary{cursor:pointer;color:var(--accent-2)}.ptopic details p{margin:6px 0}
.others>summary{cursor:pointer;font-weight:700;font-size:18px}.others{gap:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto}
.bubble{max-width:85%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.5;background:var(--tile)}.bubble.user{align-self:flex-end;background:#3a3f9e}
footer{margin-top:28px;color:var(--dim);font-size:12px;text-align:center}
#sync[data-state="erro"]{color:var(--warn)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

% de 84?",["42","50","34","4,2"],0,"50% \xE9 a metade: 84 \xF7 2 = 42."],["Porcentagens e juros simples",1,"Quanto \xE9 10% de 350?",["35","3,5","10","340"],0,"10% = 1/10; 350 \xF7 10 = 35."],["Porcentagens e juros simples",2,"Um t\xEAnis de R$ 250 est\xE1 com 20% de desconto. Qual \xE9 o pre\xE7o com desconto?",["R$ 200","R$ 230","R$ 50","R$ 270"],0,"20% de 250 = 50; 250 \u2212 50 = 200 (ou 250 \xD7 0,8)."],["Porcentagens e juros simples",2,"Um sal\xE1rio de R$ 2.000 passou para R$ 2.300. Qual foi o aumento percentual?",["15%","30%","13%","3%"],0,"Aumento de 300. 300 \xF7 2.000 = 0,15 = 15%."],["Porcentagens e juros simples",2,"Qual \xE9 o montante de R$ 500 aplicados a juros simples de 2% ao m\xEAs por 6 meses?",["R$ 560","R$ 60","R$ 510","R$ 600"],0,"J = 500 \xD7 0,02 \xD7 6 = 60. Montante = 500 + 60 = R$ 560."],["Porcentagens e juros simples",2,"Escreva 3/4 como porcentagem.",["75%","34%","3,4%","43%"],0,"3 \xF7 4 = 0,75 = 75%."],["Porcentagens e juros simples",3,"Depois de um desconto de 25%, um produto custa R$ 90. Qual era o pre\xE7o original?",["R$ 120","R$ 112,50","R$ 115","R$ 67,50"],0,"Pre\xE7o com desconto = 75% do original: 0,75 \xD7 P = 90 \u2192 P = 120. (Somar 25% de 90 d\xE1 112,50, que est\xE1 errado.)"],["Porcentagens e juros simples",3,"Em quantos meses R$ 1.000 rendem R$ 150 de juros simples a 1,5% ao m\xEAs?",["10 meses","15 meses","5 meses","100 meses"],0,"1.000 \xD7 0,015 \xD7 t = 150 \u2192 15t = 150 \u2192 t = 10."],["Porcentagens e juros simples",2,"Numa pesquisa com 200 pessoas, 30% preferem v\xF4lei. Quantas pessoas preferem v\xF4lei?",["60","30","70","6"],0,"0,30 \xD7 200 = 60."],["Contagem e princ\xEDpio multiplicativo",1,"Com 3 camisetas e 4 bermudas diferentes, quantas combina\xE7\xF5es de roupa (1 camiseta + 1 bermuda) s\xE3o poss\xEDveis?",["12","7","24","3"],0,"Princ\xEDpio multiplicativo: 3 \xD7 4 = 12."],["Contagem e princ\xEDpio multiplicativo",2,"Quantas senhas de 3 d\xEDgitos (de 0 a 9) existem, se os d\xEDgitos podem se repe a restri\xE7\xE3o: a unidade \xE9 1, 3 ou 5 (3 op\xE7\xF5es). Depois sobram 4 para a centena e 3 para a dezena: 3 \xD7 4 \xD7 3 = 36."],["Contagem e princ\xEDpio multiplicativo",2,"Quantos n\xFAmeros pares de 2 algarismos podem ser formados com 1, 2, 3, 4, 5 e 6, podendo repetir?",["18","36","15","12"],0,"A unidade \xE9 2, 4 ou 6 (3 op\xE7\xF5es) e a dezena tem 6 op\xE7\xF5es: 6 \xD7 3 = 18."],["Contagem e princ\xEDpio multiplicativo",1,"Para que serve a \xE1rvore de possibilidades?",["para listar de forma organizada todas as possibilidades","para calcular \xE1reas","para medir \xE2ngulos","para resolver equa\xE7\xF5es"],0,"Cada ramo representa uma escolha, e o total de caminhos confirma a multiplica\xE7\xE3o."],["Contagem e princ\xEDpio multiplicativo",3,"Cinco amigos se cumprimentam, cada um apertando a m\xE3o de cada outro uma vez. Quantos apertos de m\xE3o acontecem?",["10","20","25","5"],0,"5 \xD7 4 = 20 conta cada aperto duas vezes (A com B e B com A). Ent\xE3o 20 \xF7 2 = 10."],["Contagem e princ\xEDpio multiplicativo",2,"Uma sala tem 4 portas. De quantas maneiras \xE9 poss\xEDvel entrar por uma porta e sair por outra diferente?",["12","16","8","7"],0,"4 op\xE7\xF5es para entrar e 3 para sair: 4 \xD7 3 = 12."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",1,"Qual express\xE3o representa \u201Co dobro de um n\xFAmero mais 5\u201D?",["2x + 5","x\xB2 + 5","2(x + 5)","x + 10"],0,"O dobro de x \xE9 2x; depois soma-se 5. 2(x + 5) seria o dobro da soma."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",1,"Quanto \xE9 3a \xB7 4a?",["12a\xB2","7a","12a","7a\xB2"],0,"Multiplicam-se os coeficientes (3 \xD7 4 = 12) e as partes literais (a \xB7 a = a\xB2)."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",2,"Desenvolvendo (x \u2212 4)\xB2, obtemos:",["x\xB2 \u2212 8x + 16","x\xB2 \u2212 16","x\xB2 + 16","x\xB2 \u2212 4x + 16"],0,"Quadrado da diferen\xE7a: a\xB2 \u2212 2ab + b\xB2 \u2192 x\xB2 \u2212 8x + 16."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",2,"Qual \xE9 o valor de a\xB2 \u2212 b\xB2 para a = 7 e b = 3?",["40","16","58","4"],0,"49 \u2212 9 = 40. Tamb\xE9m: (a + b)(a \u2212 b) = 10 \xD7 4 = 40."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",2,"Qual \xE9 a forma fatorada de 5x + 15?",["5(x + 3)","5x(1 + 3)","x(5 + 15)","15(x + 5)"],0,"Coloca-se o fator comum 5 em evid\xEAncia: 5 \xB7 x + 5 \xB7 3 = 5(x + 3)."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",2,"O produto (2x + 3)(2x \u2212 3) \xE9 igual a:",["4x\xB2 \u2212 9","4x\xB2 + 9","2x\xB2 \u2212 9","4x\xB2 \u2212 12x \u2212 9"],0,"Produto da soma pela diferen\xE7a: (2x)\xB2 \u2212 3\xB2 = 4x\xB2 \u2212 9."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",2,"Um ret\xE2ngulo tem lados x e x + 2. Qual express\xE3o representa o seu per\xEDmetro?",["4x + 4","2x + 2","x\xB2 + 2x","4x + 2"],0,"Per\xEDmetro = 2 \xB7 x + 2 \xB7 (x + 2) = 4x + 4. (x\xB2 + 2x \xE9 a \xE1rea.)"],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",3,"Se a + b = 10 e a \xB7 b = 21, quanto vale a\xB2 + b\xB2?",["58","100","79","42"],0,"(a + b)\xB2 = a\xB2 + 2ab + b\xB2 \u2192 100 = a\xB2 + b\xB2 + 42 \u2192 a\xB2 + b\xB2 = 58."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",3,"Usando um produto not\xE1vel, calcule 998 \xD7 1002.",["999 996","1 000 004","999 999","1 000 000"],0,"(1000 \u2212 2)(1000 + 2) = 1000\xB2 \u2212 2\xB2 = 1 000 000 \u2212 4 = 999 996."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",1,"Resolva x + 9 = 4.",["x = \u22125","x = 13","x = 5","x = \u221213"],0,"x = 4 \u2212 9 = \u22125."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",1,"Resolva x/3 = 7.",["x = 21","x = 7/3","x = 10","x = 4"],0,"Multiplicando os dois lados por 3: x = 21."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Resolva 3(x \u2212 2) = 2x + 5.",["x = 11","x = \u22121","x = 1","x = 3"],0,"3x \u2212 6 = 2x + 5 \u2192 3x \u2212 2x = 5 + 6 \u2192 x = 11."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Pedro tem o triplo da idade de Ana, e juntos somam 48 anos. Qual \xE9 a idade de Pedro?",["36","12","24","16"],0,"Ana = a e Pedro = 3a. a + 3a = 48 \u2192 a = 12. Pedro tem 36."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Qual \xE9 a solu\xE7\xE3o do sistema x + y = 10 e 2x + y = 14?",["x = 4 e y = 6","x = 6 e y = 4","x = 5 e y = 5","x = 7 e y = 3"],0,"Subtraindo a 1\xAA equa\xE7\xE3o da 2\xAA: x = 4. Ent\xE3o y = 10 \u2212 4 = 6."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Quais s\xE3o as solu\xE7\xF5es de x\xB2 = 49?",["x = 7 ou x = \u22127","apenas x = 7","x = 24,5","x = 49"],0,"Tanto 7\xB2 quanto (\u22127)\xB2 d\xE3o 49, ent\xE3o h\xE1 duas solu\xE7\xF5es."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Quais s\xE3o as solu\xE7\xF5es de 2x\xB2 = 50?",["x = 5 ou x = \u22125","x = 25","x = 10","x = 12,5"],0,"x\xB2 = 25, ent\xE3o x = 5 ou x = \u22125."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",3,"Resolva (x + 1)/2 = (x \u2212 1)/3.",["x = \u22125","x = 5","x = \u22121","x = 1"],0,"Multiplicando em cruz: 3(x + 1) = 2(x \u2212 1) \u2192 3x + 3 = 2x \u2212 2 \u2192 x = \u22125."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",3,"Ingressos custam R$ 20 (adulto) e R$ 10 (crian\xE7a). Foram vendidos 30 ingressos, num total de R$ 450. Quantos eram de adulto?",["15","20","10","30"],0,"a + c = 30 e 20a + 10c = 450. Substituindo c = 30 \u2212 a: 20a + 300 \u2212 10a = 450 \u2192 a = 15."],["Grandezas proporcionais",1,"Se 3 cadernos custam R$ 24, quanto custam 5 cadernos iguais?",["R$ 40","R$ 45","R$ 32","R$ 120"],0,"Cada caderno custa 24 \xF7 3 = R$ 8; 5 \xD7 8 = R$ 40."],["Grandezas proporcionais",2,"Quatro pedreiros constroem um muro em 6 dias. Mantendo o ritmo, em quantos dias 8 pedreiros constroem o mesmo muro?",["3 dias","12 dias","8 dias","2 dias"],0,"Grandezas inversamente proporcionais: o dobro de pedreiros leva a metade do tempo."],["Grandezas proporcionais",1,"Qual par de grandezas \xE9 diretamente proporcional?",["quantidade comprada e valor pago, com pre\xE7o fixo","velocidade e tempo de viagem para a mesma dist\xE ["Potencia\xE7\xE3o e radicia\xE7\xE3o",3,"Entre quais n\xFAmeros inteiros consecutivos est\xE1 \u221A50?",["6 e 7","7 e 8","8 e 9","24 e 25"],1,"7\xB2 = 49 e 8\xB2 = 64. Como 49 < 50 < 64, \u221A50 est\xE1 entre 7 e 8 (bem perto de 7)."],["Nota\xE7\xE3o cient\xEDfica",1,"Como se escreve 45 000 000 em nota\xE7\xE3o cient\xEDfica?",["45 \xD7 10\u2076","4,5 \xD7 10\u2077","4,5 \xD7 10\u2076","0,45 \xD7 10\u2078"],1,"Na nota\xE7\xE3o cient\xEDfica, o n\xFAmero antes da pot\xEAncia fica entre 1 e 10: 4,5. A v\xEDrgula anda 7 casas, ent\xE3o 4,5 \xD7 10\u2077."],["Nota\xE7\xE3o cient\xEDfica",1,"Como se escreve 0,0006 em nota\xE7\xE3o cient\xEDfica?",["6 \xD7 10\u207B\u2074","6 \xD7 10\u207B\xB3","6 \xD7 10\u2074","0,6 \xD7 10\u207B\xB3"],0,"A v\xEDrgula anda 4 casas para a direita at\xE9 o 6, ent\xE3o o expoente \xE9 \u22124: 6 \xD7 10\u207B\u2074."],["Nota\xE7\xE3o cient\xEDfica",2,"Qual \xE9 o resultado de (2 \xD7 10\xB3) \xD7 (3 \xD7 10\u2074)?",["6 \xD7 10\u2077","6 \xD7 10\xB9\xB2","5 \xD7 10\u2077","6 \xD7 10\xB9"],0,"Multiplicam-se os n\xFAmeros (2 \xD7 3 = 6) e somam-se os expoentes das pot\xEAncias de 10 (3 + 4 = 7)."],["Nota\xE7\xE3o cient\xEDfica",2,"A dist\xE2ncia m\xE9dia entre a Terra e o Sol \xE9 de cerca de 150 milh\xF5es de km. Em nota\xE7\xE3o cient\xEDfica, isso \xE9:",["1,5 \xD7 10\u2076 km","1,5 \xD7 10\u2078 km","15 \xD7 10\u2077 km","1,5 \xD7 10\u2079 km"],1,"150 milh\xF5es = 150 000 000 = 1,5 \xD7 10\u2078. A op\xE7\xE3o 15 \xD7 10\u2077 tem o mesmo valor, mas n\xE3o est\xE1 em nota\xE7\xE3o cient\xEDfica (15 n\xE3o fica entre 1 e 10)."],["Nota\xE7\xE3o cient\xEDfica",2,"Qual \xE9 o resultado de (8 \xD7 10\u2079) \xF7 (2 \xD7 10\xB3)?",["4 \xD7 10\xB3","4 \xD7 10\u2076","6 \xD7 10\u2076","4 \xD7 10\xB9\xB2"],1,"Dividem-se os n\xFAmeros (8 \xF7 2 = 4) e subtraem-se os expoentes (9 \u2212 3 = 6)."],["Nota\xE7\xE3o cient\xEDfica",3,"Qual destes n\xFAmeros \xE9 o maior?",["3,2 \xD7 10\u2075","9,9 \xD7 10\u2074","1,1 \xD7 10\u2076","5 \xD7 10\u2075"], produtos not\xE1veis",2,"O produto (a \u2212 3)(a + 3) \xE9 igual a:",["a\xB2 \u2212 9","a\xB2 + 9","a\xB2 \u2212 6a + 9","a\xB2 \u2212 3"],0,"Produto da soma pela diferen\xE7a: (a + b)(a \u2212 b) = a\xB2 \u2212 b\xB2 \u2192 a\xB2 \u2212 9."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",2,"Simplificando 4x + 3y \u2212 x + 2y, obtemos:",["3x + 5y","5x + 5y","3x + y","8xy"],0,"Juntam-se os termos semelhantes: 4x \u2212 x = 3x e 3y + 2y = 5y."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",3,"Qual \xE9 a forma fatorada de x\xB2 \u2212 6x + 9?",["(x \u2212 3)\xB2","(x + 3)\xB2","(x \u2212 9)(x + 1)","(x \u2212 3)(x + 3)"],0,"\xC9 um trin\xF4mio quadrado perfeito: x\xB2 \u2212 2\xB7x\xB73 + 3\xB2 = (x \u2212 3)\xB2."],["Express\xF5es alg\xE9bricas e produtos not\xE1veis",3,"Usando um produto not\xE1vel, calcule 101\xB2.",["10 101","10 201","10 001","1 201"],1,"101\xB2 = (100 + 1)\xB2 = 100\xB2 + 2\xB7100\xB71 + 1\xB2 = 10 000 + 200 + 1 = 10 201."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",1,"Resolva 5x \u2212 7 = 18.",["x = 5","x = 2,2","x = 25","x = 11/5"],0,"5x = 18 + 7 = 25, logo x = 25 \xF7 5 = 5."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Resolva 2(x + 3) = x + 10.",["x = 7","x = 4","x = 2","x = 16"],1,"2x + 6 = x + 10 \u2192 2x \u2212 x = 10 \u2212 6 \u2192 x = 4."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Qual \xE9 a solu\xE7\xE3o do sistema x + y = 12 e x \u2212 y = 4?",["x = 6 e y = 6","x = 10 e y = 2","x = 8 e y = 4","x = 4 e y = 8"],2,"Somando as equa\xE7\xF5es: 2x = 16 \u2192 x = 8. Ent\xE3o y = 12 \u2212 8 = 4."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",2,"Em um estacionamento h\xE1 carros e motos: 20 ve\xEDculos e 56 rodas ao todo. Quantas s\xE3o as motos?",["8","12","10","14"],1,"c + m = 20 e 4c + 2m = 56. Substituindo m = 20 \u2212 c: 4c + 40 \u2212 2c = 56 \u2192 c = 8. Logo, m = 12."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",3,"A soma de tr\xEAs n\xFAmeros inteiros consecutivos \xE9 72. Qual \xE9 o maior deles?",["23","24","25","26"],2,"n + (n + 1) + (n + 2) = 72 \u2192 3n + 3 = 72 \u2192 n = 23. Os n\xFAmeros s\xE3o 23, 24 e 25."],["Equa\xE7\xF5es do 1\xBA grau e sistemas",3,"Se 2x + y = 7 e x + 3y = 11, quanto vale x + y?",["4","6","7","5"],3,"Da 1\xAA equa\xE7\xE3o, y = 7 \u2212 2x. Na 2\xAA: x + 21 \u2212 6x = 11 \u2192 x = 2 e y = 3. Logo x + y = 5."],["Geometria: \xE2ngulos, pol\xEDgonos e congru\xEAncia",1,"Qual \xE9 a soma dos \xE2ngulos internos de um hex\xE1gono?",["540\xB0","720\xB0","900\xB0","360\xB0"],1,"Soma = (n \u2212 2) \xD7 180\xB0 = (6 \u2212 2) \xD7 180\xB0 = 720\xB0."],["Geometria: \xE2ngulos, pol\xEDgonos e congru\xEAncia",2,"Quanto mede cada \xE2ngulo interno de um pent\xE1gono regular?",["72\xB0","90\xB0","108\xB0","120\xB0"],2,"Soma dos \xE2ngulos: (5 \u2212 2) \xD7 180\xB0 = 540\xB0. Como s\xE3o 5 \xE2ngulos iguais: 540\xB0 \xF7 5 = 108\xB0."],["Geometria: \xE2ngulos, pol\xEDgonos e congru\xEAncia",1,"Dois \xE2ngulos s\xE3o suplementares e um deles mede 65\xB0. Quanto mede o outro?",["25\xB0","125\xB0","295\xB0","115\xB0"],3,"\xC2ngulos suplementares somam 180\xB0: 180\xB0 \u2212 65\xB0 = 115\xB0."],["Geometria: \xE2ngulos, pol\xEDgonos e congru\xEAncia",2,"Qual destes casos N\xC3O garante que dois tri\xE2ngulos sejam congruentes?",["LLL","LAL","ALA","AAA"],3,"Com tr\xEAs \xE2ngulos iguais (AAA), os tri\xE2ngulos t\xEAm a mesma forma, mas podem ter tamanhos diferentes: s\xE3o semelhantes, n\xE3o necessariamente congruentes."],["Geometria: \xE2ngulos, pol\xEDgonos e congru\xEAncia",2,"Em um tri\xE2ngulo is\xF3sceles, o \xE2ngulo formado pelos dois lados iguais mede 40\xB0. Quanto mede cada \xE2ngulo da base?",["70\xB0","40\xB0","140\xB0","50\xB0"],0,"Os \xE2ngulos da base s\xE3o iguais: (180\xB0 \u2212 40\xB0) \xF7 2 = 70\xB0."],["Geometria: \xE2ngulos, pol\xEDgonos e congru\xEAncia",3,"Quantas diagonais tem um oct\xF3gono (pol\xEDgono de 8 lados)?",["16","20","24","40"],1,"d = n(n \u2212 3)/2 = 8 \xD7 5 / 2 = 20."],["\xC1rea de figuras planas",1,"Qual \xE9 a \xE1rea de um quadrado de lado 9 cm?",["36 cm\xB2","81 cm\xB2","18 cm\xB2","72 cm\xB2"],1,"\xC1rea do quadrado = lado \xD7 lado = 9 \xD7 9 = 81 cm\xB2. (36 cm seria o per\xEDmetro.)"],["\xC1rea de figuras planas",2,"Um trap\xE9zio tem bases de 10 cm e 6 cm e altura de 4 cm. Qual \xE9 a sua \xE1rea?",["32 cm\xB2","64 cm\xB2","40 cm\xB2","24 cm\xB2"],0,"A = (B + b) \xD7 h / 2 = (10 + 6) \xD7 4 / 2 = 32 cm\xB2."],["\xC1rea de figuras planas",2,"Qual \xE9 a \xE1rea de um c\xEDrculo de raio 5 cm? (Use \u03C0 \u2248 3,14.)",["31,4 cm\xB2","78,5 cm\xB2","15,7 cm\xB2","157 cm\xB2"],1,"A = \u03C0 \xD7 r\xB2 = 3,14 \xD7 25 = 78,5 cm\xB2. (31,4 cm \xE9 o comprimento da circunfer\xEAncia.)"],["\xC1rea de figuras planas",2,"Um losango tem diagonais de 12 cm e 8 cm. Qual \xE9 a sua \xE1rea?",["96 cm\xB2","20 cm\xB2","48 cm\xB2","40 cm\xB2"],2,"A = (D \xD7 d) / 2 = (12 \xD7 8) / 2 = 48 cm\xB2."],["\xC1rea de figuras planas",3,"Um terreno retangular mede 20 m por 15 m. Se cada metro quadrado de grama custa R$ 12, quanto custa gramar o terreno todo?",["R$ 420","R$ 840","R$ 4.200","R$ 3.600"],3,"\xC1rea = 20 \xD7 15 = 300 m\xB2. Custo = 300 \xD7 12 = R$ 3.600."],["\xC1rea de figuras planas",3,"Se o lado de um quadrado dobra, o que acontece com a \xE1rea?",["dobra","triplica","fica 4 vezes maior","n\xE3o muda"],2,"Com lado 2L, a \xE1rea \xE9 (2L)\xB2 = 4L\xB2: quatro vezes a \xE1rea original."],["Probabilidade e estat\xEDstica",1,"Ao lan\xE7ar um dado comum, qual \xE9 a probabilidade de sair um n\xFAmero par?",["1/6","1/3","1/2","2/3"],2,"H\xE1 3 resultados pares (2, 4, 6) entre 6 poss\xEDveis: 3/6 = 1/2."],["Probabilidade e estat\xEDstica",2,"Uma urna tem 3 bolas vermelhas e 5 azuis. Sorteando uma bola, qual \xE9 a probabilidade de ela ser vermelha?",["3/5","3/8","5/8","1/3"],1,"Casos favor\xE1veis: 3. Total de bolas: 3 + 5 = 8. Probabilidade = 3/8."],["Probabilidade e estat\xEDstica",1,"Qual \xE9 a moda do conjunto 2, 5, 5, 7, 9?",["5","7","5,6","2"],0,"Moda \xE9 o valor que mais se repete: o 5 aparece duas vezes."],["Probabilidade e estat\xEDstica",2,"Qual \xE9 a mediana do conjunto 3, 8, 1, 6, 4?",["6","4","4,4","8"],1,"Em ordem: 1, 3, 4, 6, 8. O termo do meio \xE9 4. (4,4 \xE9 a m\xE9dia.)"],["Probabilidade e estat\xEDstica",2,"Lan\xE7ando duas moedas, qual \xE9 a probabilidade de sair cara nas duas?",["1/2","1/3","1/4","3/4"],2,"Resultados poss\xEDveis: CC, CK, KC, KK. S\xF3 um \xE9 \u201Cduas caras\u201D: 1/4."],["Probabilidade e estat\xEDstica",3,"As notas 6, 7, 8 e x t\xEAm m\xE9dia 7,5. Qual \xE9 o valor de x?",["7,5","8","10","9"],3,"Soma = 7,5 \xD7 4 = 30. Ent\xE3o 6 + 7 + 8 + x = 30 \u2192 x = 9."]],sa={subject:"Matem\xE1tica",items:[...qa,...oa]};var ia={subject:"L\xEDngua Portuguesa",items:[["Leitura e interpreta\xE7\xE3o de textos",1,"Leia: \u201CMaria saiu cedo de casa levando guarda-chuva e casaco, mesmo com o c\xE9u ainda claro.\u201D O que se pode inferir?",["Maria imaginava que o tempo poderia mudar.","Maria esqueceu o guarda-chuva.","Estava chovendo quando Maria saiu.","Maria n\xE3o gosta de sair cedo."],0,"O texto n\xE3o diz que ia chover, mas levar guarda-chuva e casaco com o c\xE9u claro sugere que Maria esperava mudan\xE7a no tempo. Isso \xE9 uma infer\xEAncia."],["Leitura e interpreta\xE7\xE3o de textos",2,"O tema de um texto \xE9:",["o assunto central de que o texto trata","o t\xEDtulo escolhido pelo autor","a primeira frase do texto","a opini\xE3o de um personagem"],0,"O tema \xE9 a ideia geral que atravessa o texto; o t\xEDtulo pode ou n\xE3o revel\xE1-lo."],["Leitura e interpreta\xE7\xE3o de textos",2,"Em \u201CO time jogou t\xE3o mal que a torcida saiu antes do fim\u201D, que rela\xE7\xE3o de sentido a express\xE3o \u201Ct\xE3o\u2026 que\u201D estabelece?",["consequ\xEAncia","compara\xE7\xE3o","finalidade","oposi\xE7\xE3o"],0,"A sa\xEDda da torcida \xE9 consequ\xEAncia de o time ter jogado mal."],["Leitura e interpreta\xE7\xE3o de textos",2,"Na frase \u201CAquele professor \xE9 uma enciclop\xE9dia ambulante\u201D, a express\xE3o destacada significa que o professor:",["sabe muito sobre muitos assuntos","carrega livros para todo lado","anda muito pela escola","escreveu uma enciclop\xE9dia"],0,"\xC9 uma met\xE1fora: compara-se o professor a uma enciclop\xE9dia para indicar grande conhecimento."],["Leitura e interpreta\xE7\xE3o de textos",3,"\u201CQue \xF3timo! Choveu justo no dia do passeio.\u201D Qual efeito de sentido predomina nessa fala?",["ironia, que expressa frustra\xE7\xE3o","elogio sincero \xE0 chuva","informa\xE7\xE3o neutra sobre o tempo","pedido de ajuda"],0,"A pessoa diz \u201Cque \xF3timo\u201D, mas quer dizer o contr\xE1rio: est\xE1 frustrada. Dizer o oposto do que se pensa \xE9 ironia."],["Leitura e interpreta\xE7\xE3o de textos",3,"Em \u201CPedro, que nunca perde um treino, faltou hoje\u201D, qual informa\xE7\xE3o est\xE1 impl\xEDcita?",["Pedro costuma ir aos treinos.","Pedro est\xE1 doente.","Pedro n\xE3o gosta de treinar.","O treino foi cancelado."],0,"A ora\xE7\xE3o \u201Cque nunca perde um treino\u201D pressup\xF5e que Pedro \xE9 ass\xEDduo. As demais op\xE7\xF5es n\xE3o podem ser confirmadas pelo texto."],["Argumenta\xE7\xE3o e artigo de opini\xE3o",1,"Em um artigo de opini\xE3o, a tese \xE9:",["a ideia central que o autor defende","um dado estat\xEDstico","o t\xEDtulo do jornal","a assinatura do autor"],0,"A tese \xE9 o ponto de vista principal; os argumentos servem para sustent\xE1-la."],["Argumenta\xE7\xE3o e artigo de opini\xE3o",2,"Qual frase apresenta um argumento baseado em dados?",["\u201CUma pesquisa com 2 mil estudantes indicou que quem l\xEA todo dia escreve melhor.\u201D","\u201CEu acho que ler \xE9 importante.\u201D","\u201CLer \xE9 bom porque \xE9 bom.\u201D","\u201CMinha av\xF3 sempre dizia para ler.\u201D"],0,"S\xF3 a primeira apoia a ideia em uma pesquisa. As outras s\xE3o opini\xE3o pessoal, repeti\xE7\xE3o da ideia ou relato sem comprova\xE7\xE3o."],["Argumenta\xE7\xE3o e artigo de opini\xE3o",2,"Em \u201CO projeto \xE9 caro; no entanto, traz benef\xEDcios duradouros\u201D, o conectivo \u201Cno entanto\u201D indica:",["oposi\xE7\xE3o","adi\xE7\xE3o","conclus\xE3o","explica\xE7\xE3o"],0,"\u201CNo entanto\u201D equivale a \u201Cmas\u201D, \u201Cpor\xE9m\u201D: contrap\xF5e o custo aos benef\xEDcios."],["Argumenta\xE7\xE3o e artigo de opini\xE3o",2,"Onde o artigo de opini\xE3o costuma ser publicado?",["em jornais, revistas e sites, com assinatura do autor","em bulas de rem\xE9dio","em dicion\xE1rios","em manuais de instru\xE7\xE3o"],0,"\xC9 um g\xEAnero jornal\xEDstico opinativo, assinado por quem defende o ponto de vista."],["Argumenta\xE7\xE3o e artigo de opini\xE3o",3,"O contra-argumento, em um texto argumentativo, \xE9:",["uma ideia contr\xE1ria \xE0 tese, apresentada pelo autor para ser refutada","a repeti\xE7\xE3o da tese com outras palavras","o t\xEDtulo do texto","a lista de refer\xEAncias"],0,"Ao prever e responder a uma obje\xE7\xE3o, o autor fortalece sua pr\xF3pria tese."],["Argumenta\xE7\xE3o e artigo de opini\xE3o",3,"Qual destas N\xC3O \xE9 uma estrat\xE9gia argumentativa?",["usar rimas s\xF3 para enfeitar o texto","dar exemplos","citar especialistas","fazer compara\xE7\xF5es"],0,"Exemplos, cita\xE7\xF5es e compara\xE7\xF5es sustentam a tese. Rimas decorativas n\xE3o acrescentam raz\xF5es ao argumento."],["Coes\xE3o e coer\xEAncia",1,"\u201CAna comprou um livro. Ela adorou o livro.\u201D Qual palavra substitui \u201Co livro\u201D e evita a repeti\xE7\xE3o? (Ela ___ adorou.)",["o","ela","lhe","seu"],0,"O pronome obl\xEDquo \u201Co\u201D retoma \u201Co livro\u201D: \u201CEla o adorou.\u201D Isso \xE9 coes\xE3o por refer\xEAncia."],["Coes\xE3o e coer\xEAncia",2,"Complete com o conectivo adequado: \u201CEstudei muito, ___ tirei nota baixa.\u201D",["mas","por isso","portanto","porque"],0,"H\xE1 uma quebra de expectativa (estudar muito e tirar nota baixa), ent\xE3o o conectivo \xE9 de oposi\xE7\xE3o: \u201Cmas\u201D."],["Coes\xE3o e coer\xEAncia",2,"Qual \xE9 o problema da frase \u201CEle estava muito cansado, por isso correu mais 10 km\u201D?",["a rela\xE7\xE3o de causa e consequ\xEAncia \xE9 il\xF3gica","h\xE1 erro de ortografia","falta pontua\xE7\xE3o","usa g\xEDria"],0,"O cansa\xE7o n\xE3o costuma ser motivo para correr mais. A frase fica incoerente."],["Coes\xE3o e coer\xEAncia",2,"Em \u201CChoveu muito. Isso atrasou a obra.\u201D, o pronome \u201Cisso\u201D retoma:",["o fato de ter chovido muito","a obra","o atraso","uma chuva futura"],0,"\u201CIsso\u201D resume a informa\xE7\xE3o anterior inteira: a chuva forte."],["Coes\xE3o e coer\xEAncia",3,"A coer\xEAncia de um texto est\xE1 ligada principalmente:",["ao sentido l\xF3gico e \xE0 unidade das ideias","ao uso de v\xEDrgulas","ao tamanho dos par\xE1grafos","ao n\xFAmero de palavras"],0,"Coer\xEAncia \xE9 a l\xF3gica do sentido. Coes\xE3o s\xE3o as liga\xE7\xF5es formais (pronomes, conectivos) entre as partes."],["Coes\xE3o e coer\xEAncia",3,"Qual conectivo introduz uma conclus\xE3o?",["logo","embora","caso","quando"],0,"\u201CLogo\u201D equivale a \u201Cportanto\u201D. \u201CEmbora\u201D indica concess\xE3o, \u201Ccaso\u201D condi\xE7\xE3o e \u201Cquando\u201D tempo."],["Ora\xE7\xF5es e per\xEDodos",1,"Um per\xEDodo simples \xE9 formado por:",["uma \xFAnica ora\xE7\xE3o","duas ora\xE7\xF5es","nenhum verbo","tr\xEAs ora\xE7\xF5es ou mais"],0,"Cada ora\xE7\xE3o se organiza em torno de um verbo (ou locu\xE7\xE3o verbal). Per\xEDodo simples: um s\xF3 verbo, uma ora\xE7\xE3o."],["Ora\xE7\xF5es e per\xEDodos",1,"Quantas ora\xE7\xF5es h\xE1 em \u201CCheguei, tomei banho e dormi\u201D?",["3","1","2","4"],0,"H\xE1 tr\xEAs verbos (cheguei, tomei, dormi), portanto tr\xEAs ora\xE7\xF5es."],["Ora\xE7\xF5es e per\xEDodos",2,"Em \u201CEstudo, mas n\xE3o aprendo\u201D, a segunda ora\xE7\xE3o \xE9 coordenada:",["adversativa","aditiva","conclusiva","explicativa"],0,"O conectivo \u201Cmas\u201D indica oposi\xE7\xE3o: ora\xE7\xE3o coordenada sind\xE9tica adversativa."],["Ora\xE7\xF5es e per\xEDodos",2,"Qual per\xEDodo \xE9 composto por subordina\xE7\xE3o?",["\u201CEspero que voc\xEA venha.\u201D","\u201CRi e chorei.\u201D","\u201CChoveu.\u201D","\u201CCorri, pulei, gritei.\u201D"],0,"\u201CQue voc\xEA venha\u201D completa o sentido de \u201Cespero\u201D (funciona como objeto direto): uma ora\xE7\xE3o depende da outra."],["Ora\xE7\xF5es e per\xEDodos",2,"Qual \xE9 o sujeito de \u201CChegaram as encomendas\u201D?",["as encomendas","chegaram","sujeito oculto","ora\xE7\xE3o sem sujeito"],0,"O sujeito pode vir depois do verbo: quem chegou? As encomendas."],["Ora\xE7\xF5es e per\xEDodos",3,"Em \u201CSa\xED cedo, pois tinha prova\u201D, a ora\xE7\xE3o \u201Cpois tinha prova\u201D \xE9 coordenada:",["explicativa","adversativa","aditiva","alternativa"],0,"\u201CPois\u201D antes do verbo introduz uma explica\xE7\xE3o para o que foi dito antes."],["Vozes verbais",1,"Qual \xE9 a voz passiva de \u201CO cachorro mordeu o carteiro\u201D?",["O carteiro foi mordido pelo cachorro.","O carteiro mordeu o cachorro.","O cachorro foi mordido.","O carteiro se mordeu."],0,"Na passiva anal\xEDtica, o objeto vira sujeito (o carteiro), usa-se ser + partic\xEDpio (foi mordido) e o agente aparece com \u201Cpor\u201D (pelo cachorro)."],["Vozes verbais",1,"Em \u201CA menina se penteou\u201D, o verbo est\xE1 na voz:",["reflexiva","ativa","passiva anal\xEDtica","passiva sint\xE9tica"],0,"A menina pratica e recebe a a\xE7\xE3o ao mesmo tempo (penteou a si mesma)."],["Vozes verbais",2,"Em \u201CVendem-se casas\u201D, o verbo est\xE1 na voz:",["passiva sint\xE9tica","ativa","reflexiva","passiva anal\xEDtica"],0,"Verbo + \u201Cse\u201D (pronome apassivador) com sujeito paciente: casas s\xE3o vendidas."],["Vozes verbais",2,"Em \u201CO pr\xEAmio foi entregue pelo diretor\u201D, qual \xE9 o agente da passiva?",["pelo diretor","o pr\xEAmio","foi entregue","entregue"],0,"O agente da passiva indica quem pratica a a\xE7\xE3o e vem introduzido por \u201Cpor/pelo\u201D."],["Vozes verbais",2,"Qual \xE9 a passiva anal\xEDtica de \u201COs alunos organizaram a feira\u201D?",["A feira foi organizada pelos alunos.","Organizou-se a feira.","A feira organizou os alunos.","Os alunos foram organizados."],0,"\u201COrganizou-se a feira\u201D tamb\xE9m \xE9 passiva, mas sint\xE9tica. A anal\xEDtica usa ser + partic\xEDpio: \u201Cfoi organizada\u201D."],["Vozes verbais",3,"Uma manchete diz: \u201CVidros da escola s\xE3o quebrados durante a noite\u201D. Por que o jornal usou a passiva sem agente?",["porque o autor da a\xE7\xE3o \xE9 desconhecido ou o foco est\xE1 no fato","para mostrar quem quebrou os vidros","porque a manchete \xE9 uma ordem","porque o verbo est\xE1 no futuro"],0,"A passiva sem agente destaca o que aconteceu, e n\xE3o quem fez. \xC9 \xFAtil quando o respons\xE1vel \xE9 desconhecido."],["Pontua\xE7\xE3o e efeitos de sentido",1,"Qual frase est\xE1 pontuada corretamente?",["Pedro, venha c\xE1.","Pedro venha c\xE1.","Pedro venha, c\xE1.","Pedro: venha c\xE1"],0,"\u201CPedro\u201D \xE9 vocativo (quem \xE9 chamado) e deve ser separado por v\xEDrgula."],["Pontua\xE7\xE3o e efeitos de sentido",2,"Compare \u201CN\xE3o, quero sair.\u201D e \u201CN\xE3o quero sair.\u201D. O que muda?",["na primeira a pessoa quer sair; na segunda, n\xE3o quer","nada, as frases s\xE3o iguais","nas duas a pessoa quer sair","nas duas a pessoa n\xE3o quer sair"],0,"Na primeira, o \u201Cn\xE3o\u201D responde a outra pergunta e a pessoa afirma que quer sair. A v\xEDrgula muda o sentido."],["Pontua\xE7\xE3o e efeitos de sentido",2,"As retic\xEAncias (\u2026) costumam indicar:",["interrup\xE7\xE3o, hesita\xE7\xE3o ou suspense","uma pergunta direta","o fim neutro de uma frase","uma enumera\xE7\xE3o"],0,"Elas sugerem que algo ficou por dizer, uma pausa ou d\xFAvida."],["Pontua\xE7\xE3o e efeitos de sentido",2,"As aspas servem, entre outros usos, para:",["marcar cita\xE7\xF5es ou palavras com sentido especial","separar o vocativo","indicar uma pergunta","separar o sujeito do verbo"],0,"Aspas destacam falas citadas, t\xEDtulos, estrangeirismos ou ironia."],["Pontua\xE7\xE3o e efeitos de sentido",3,"A frase \u201COs alunos da escola, fizeram a prova.\u201D est\xE1:",["incorreta, porque n\xE3o se separa sujeito e verbo com v\xEDrgula","correta, porque a v\xEDrgula \xE9 obrigat\xF3ria","correta, porque h\xE1 vocativo","incorreta, porque falta ponto de exclama\xE7\xE3o"],0,"\u201COs alunos da escola\u201D \xE9 o sujeito de \u201Cfizeram\u201D. N\xE3o se usa v\xEDrgula entre sujeito e verbo."],["Pontua\xE7\xE3o e efeitos de sentido",3,"Em \u201CComprei tr\xEAs frutas: ma\xE7\xE3, pera e uva.\u201D, os dois-pontos indicam:",["uma enumera\xE7\xE3o que explica o que foi dito","uma interrup\xE7\xE3o","uma exclama\xE7\xE3o","o in\xEDcio de um di\xE1logo"],0,"Os dois-pontos anunciam a lista das tr\xEAs frutas."],["G\xEAneros jornal\xEDsticos e digitais",1,"Qual \xE9 o principal objetivo de uma not\xEDcia?",["informar um fato recente de forma objetiva","convencer o leitor da opini\xE3o do autor","ensinar a montar um objeto","contar uma hist\xF3ria inventada"],0,"A not\xEDcia relata fatos atuais. A opini\xE3o \xE9 pr\xF3pria de g\xEAneros como o artigo de opini\xE3o e o editorial."],["G\xEAneros jornal\xEDsticos e digitais",2,"O lide (primeiro par\xE1grafo) de uma not\xEDcia costuma responder:",["o qu\xEA, quem, quando, onde, como e por qu\xEA","apenas a opini\xE3o do jornalista","o pre\xE7o do jornal","quem \xE9 o editor-chefe"],0,"O lide resume as informa\xE7\xF5es essenciais logo no come\xE7o."],["G\xEAneros jornal\xEDsticos e digitais",2,"Qual \xE9 a principal diferen\xE7a entre reportagem e not\xEDcia?",["a reportagem aprofunda o assunto, com mais pesquisa, entrevistas e dados","a reportagem \xE9 sempre ficcional","a not\xEDcia \xE9 sempre mais longa","n\xE3o h\xE1 diferen\xE7a"],0,"A not\xEDcia informa o fato; a reportagem investiga e contextualiza o tema."],["G\xEAneros jornal\xEDsticos e digitais",2,"A manchete \xE9:",["o t\xEDtulo principal de uma not\xEDcia ou da capa","o \xFAltimo dadeiras","para vender produtos","para publicar memes","para hospedar v\xEDdeos"],0,"Elas investigam boatos e publicam a verifica\xE7\xE3o com as fontes consultadas."],["An\xE1lise de fontes e checagem de informa\xE7\xF5es",3,"O que \xE9 uma imagem \u201Cfora de contexto\u201D?",["uma foto verdadeira usada para ilustrar outro fato, induzindo ao erro","uma foto em baixa resolu\xE7\xE3o","uma foto com legenda correta","uma foto de acervo p\xFAblico com cr\xE9dito"],0,"A imagem \xE9 real, mas a legenda ou o contexto s\xE3o falsos. A busca reversa de imagens ajuda a descobrir a origem."],["An\xE1lise de fontes e checagem de informa\xE7\xF5es",3,"Uma fonte prim\xE1ria \xE9:",["um documento ou relato produzido por quem viveu ou registrou diretamente o fato","um coment\xE1rio de terceiros em rede social","um resumo feito por um influenciador","um boato repassado"],0,"Fontes prim\xE1rias (documentos, dados oficiais, testemunhos) s\xE3o a base da verifica\xE7\xE3o; as demais dependem delas."]]};var ra={subject:"Ci\xEAncias",items:[["Fontes e transforma\xE7\xE3o de energia",1,"Qual destas \xE9 uma fonte de energia renov\xE1vel?",["energia e\xF3lica","petr\xF3leo","carv\xE3o mineral","g\xE1s natural"],0,"O vento se renova continuamente. Petr\xF3leo, carv\xE3o e g\xE1s natural s\xE3o combust\xEDveis f\xF3sseis, que levam milh\xF5es de anos para se formar."],["Fontes e transforma\xE7\xE3o de energia",2,"Em uma usina hidrel\xE9trica, qual \xE9 a principal transforma\xE7\xE3o de energia?",["energia potencial da \xE1gua em energia el\xE9trica","energia qu\xEDmica em energia luminosa","energia nuclear em energia t\xE9rmica","energia el\xE9trica em energia qu\xEDmica"],0,"A \xE1gua represada tem energia potencial. Ao cair, ganha energia cin\xE9tica, gira as turbinas, e o gerador a converte em energia el\xE9trica."],["Fontes e transforma\xE7\xE3o de energia",2,"Um painel solar fotovoltaico transforma:",["energia luminosa em energia el\xE9trica","energia el\xE9trica em energia luminosa","energia t\xE9rmica em energia nuclear","energia sonora em energia el\xE9trica"],0,"As c\xE9lulas fotovoltaicas convertem a luz do Sol diretamente em corrente el\xE9trica."],["Fontes e transforma\xE7\xE3o de energia",2,"Um liquidificador ligado transforma principalmente:",["energia el\xE9trica em energia mec\xE2nica (movimento)","energia mec\xE2nica em energia el\xE9trica","energia qu\xEDmica em energia el\xE9trica","energia luminosa em energia t\xE9rmica"],0,"O motor el\xE9trico faz as l\xE2minas girarem. Parte da energia tamb\xE9m vira calor e som."],["Fontes e transforma\xE7\xE3o de energia",2,"Qual \xE9 uma desvantagem das usinas termel\xE9tricas a carv\xE3o?",["emitem gases de efeito estufa e poluentes","dependem da for\xE7a dos ventos","n\xE3o funcionam \xE0 noite","precisam de mar\xE9s"],0,"A queima de carv\xE3o libera CO\u2082 e outros poluentes que afetam o clima e a sa\xFAde."],["Fontes e transforma\xE7\xE3o de energia",3,"O princ\xEDpio da conserva\xE7\xE3o da energia afirma que:",["a energia n\xE3o \xE9 criada nem destru\xEDda, apenas transformada","a energia se perde totalmente a cada uso","s\xF3 existe energia el\xE9trica","as usinas criam energia do nada"],0,"Nas transforma\xE7\xF5es, parte da energia pode virar calor \u201Cn\xE3o aproveitado\u201D, mas a quantidade total se conserva."],["Circuitos el\xE9tricos e consumo respons\xE1vel",1,"Para uma l\xE2mpada acender, o circuito el\xE9trico precisa de:",["uma fonte, fios condutores e a l\xE2mpada em um caminho fechado","apenas uma l\xE2mpada","apenas fios","um interruptor aberto"],0,"A corrente s\xF3 circula em circuito fechado. Com o interruptor aberto, o caminho \xE9 interrompido."],["Circuitos el\xE9tricos e consumo respons\xE1vel",2,"Um chuveiro de 5.000 W fica ligado 30 minutos por dia durante 30 dias. Quanto ele consome no m\xEAs?",["75 kWh","150 kWh","2.500 kWh","7,5 kWh"],0,"Energia = pot\xEAncia \xD7 tempo = 5 kW \xD7 0,5 h \xD7 30 dias = 75 kWh."],["Circuitos el\xE9tricos e consumo respons\xE1vel",2,"Em um circuito em s\xE9rie com tr\xEAs l\xE2mpadas, se uma delas queimar:",["todas apagam","s\xF3 ela apaga","as outras brilham mais","nada muda"],0,"Em s\xE9rie h\xE1 um \xFAnico caminho para a corrente. Se ele \xE9 interrompido, todas apagam. Nas casas, os aparelhos s\xE3o ligados em paralelo."],["Circuitos el\xE9tricos e consumo respons\xE1vel",2,"Qual unidade de energia aparece na conta de luz?",["quilowatt-hora (kWh)","volt (V)","amp\xE8re (A)","watt (W)"],0,"O watt mede pot\xEAncia; o kWh mede energia (pot\xEAncia \xD7 tempo), que \xE9 o que se paga."],["Circuitos el\xE9tricos e consumo respons\xE1vel",2,"Qual material \xE9 um bom condutor de eletricidade?",["cobre","borracha","pl\xE1stico","madeira seca"],0,"Metais como o cobre conduzem bem a corrente. Borracha e pl\xE1stico s\xE3o isolantes e revestem os fios."],["Circuitos el\xE9tricos e consumo respons\xE1vel",3,"Qual atitude reduz o consumo de energia el\xE9trica em casa?",["trocar l\xE2mpadas incandescentes por LED","deixar aparelhos em modo de espera (stand-by)","abrir a geladeira muitas vezes","tomar banhos longos no chuveiro el\xE9trico"],0,"L\xE2mpadas LED gastam bem menos energia para a mesma ilumina\xE7\xE3o. As outras atitudes aumentam o consumo."],["Reprodu\xE7\xE3o e sexualidade com respeito e informa\xE7\xE3o",1,"Qual \xE9 o principal horm\xF4nio masculino produzido nos test\xEDculos?",["testosterona","insulina","adrenalina","estrog\xEAnio"],0,"A testosterona provoca as mudan\xE7as da puberdade masculina, como a voz mais grave e o crescimento de pelos."],["Reprodu\xE7\xE3o e sexualidade com respeito e informa\xE7\xE3o",1,"Em geral, onde ocorre a fecunda\xE7\xE3o no corpo humano?",["nas tubas uterinas","no \xFAtero","nos ov\xE1rios","na vagina"],0,"O espermatozoide encontra o ov\xF3cito na tuba uterina. O embri\xE3o depois se implanta no \xFAtero."],["Reprodu\xE7\xE3o e sexualidade com respeito e informa\xE7\xE3o",2,"Qual m\xE9todo, al\xE9m de evitar gravidez, tamb\xE9m protege contra infec\xE7\xF5es sexualmente transmiss\xEDveis (ISTs)?",["preservativo (camisinha)","p\xEDlula anticoncepcional","DIU","tabelinha"],0,"S\xF3 os preservativos (masculino ou feminino) formam uma barreira que tamb\xE9m reduz a transmiss\xE3o de ISTs."],["Reprodu\xE7\xE3o e sexualidade com respeito e informa\xE7\xE3o",2,"A puberdade \xE9:",["a fase de mudan\xE7as corporais e hormonais que torna o corpo capaz de se reproduzir","uma fase que s\xF3 ocorre em meninos","uma doen\xE7a passageira","o fim do crescimento, aos 10 anos"],0,"Ela come\xE7a em idades diferentes para cada pessoa e envolve mudan\xE7as f\xEDsicas e emocionais."],["Reprodu\xE7\xE3o e sexualidade com respeito e informa\xE7\xE3o",2,"A menstrua\xE7\xE3o acontece quando:",["n\xE3o h\xE1 fecunda\xE7\xE3o e a camada interna do \xFAtero se descama","ocorre a fecunda\xE7\xE3o","o ov\xF3cito \xE9 fecundado no ov\xE1rio","o espermatozoide chega ao \xFAtero"],0,"Sem gravidez, os horm\xF4nios caem e o endom\xE9trio preparado para receber o embri\xE3o \xE9 eliminado."],["Reprodu\xE7\xE3o e sexualidade com respeito e informa\xE7\xE3o",3,"Sobre o respeito ao pr\xF3prio corpo e ao dos outros, qual afirma\xE7\xE3o est\xE1 correta?",["Ningu\xE9m deve tocar o corpo de outra pessoa sem consentimento, e situa\xE7\xF5es de abuso devem ser contadas a um adulto de confian\xE7a.","Se for algu\xE9m conhecido, n\xE3o h\xE1 problema em tocar sem permiss\xE3o.","Segredos sobre toques que causam desconforto devem ser guardados.","S\xF3 os adultos t\xEAm direito sobre o pr\xF3prio corpo."],0,"Consentimento \xE9 essencial em qualquer idade. Canais de ajuda: respons\xE1veis, professores, Conselho Tutelar e o Disque 100."],["Sistema Sol, Terra e Lua",1,"O que causa a sucess\xE3o dos dias e das noites?",["a rota\xE7\xE3o da Terra","a transla\xE7\xE3o da Terra","as fases da Lua","a dist\xE2ncia entre a Terra e o Sol"],0,"Ao girar em torno do pr\xF3prio eixo (cerca de 24 h), cada lado da Terra fica voltado ou n\xE3o para o Sol."],["Sistema Sol, Terra e Lua",2,"Qual \xE9 a principal causa das esta\xE7\xF5es do ano?",["a inclina\xE7\xE3o do eixo da Terra durante a transla\xE7\xE3o","a Terra ficar muito mais perto do Sol no ver\xE3o","a rota\xE7\xE3o da Lua","os eclipses"],0,"A inclina\xE7\xE3o faz os hemisf\xE9rios receberem luz solar com \xE2ngulos e dura\xE7\xF5es diferentes ao longo do ano. A varia\xE7\xE3o da dist\xE2ncia ao Sol \xE9 pequena."],["Sistema Sol, Terra e Lua",1,"Quanto tempo dura, aproximadamente, uma volta da Terra ao redor do Sol (transla\xE7\xE3o)?",["365 dias","24 horas","29,5 dias","7 dias"],0,"S\xE3o cerca de 365 dias e 6 horas. Por isso, a cada 4 anos h\xE1 um ano bissexto."],["Sistema Sol, Terra e Lua",2,"Quando \xE9 ver\xE3o no Hemisf\xE9rio Sul, que esta\xE7\xE3o \xE9 no Hemisf\xE9rio Norte?",["inverno","ver\xE3o","primavera","outono"],0,"Os hemisf\xE9rios t\xEAm esta\xE7\xF5es opostas, porque um est\xE1 mais inclinado para o Sol enquanto o outro est\xE1 menos."],["Sistema Sol, Terra e Lua",2,"Por que vemos a Lua brilhar no c\xE9u?",["porque ela reflete a luz do Sol","porque tem luz pr\xF3pria","porque reflete apenas a luz da Terra","porque \xE9 uma estrela"],0,"A Lua n\xE3o produz luz: \xE9 iluminada pelo Sol, como a Terra."],["Sistema Sol, Terra e Lua",3,"O solst\xEDcio de dezembro (por volta do dia 21) marca, no Hemisf\xE9rio Sul:",["o dia mais longo do ano","a noite mais longa do ano","dia e noite com a mesma dura\xE7\xE3o","um eclipse solar"],0,"Em dezembro, o Hemisf\xE9rio Sul est\xE1 mais inclinado para o Sol: come\xE7a o ver\xE3o e ocorre o dia mais longo."],["Fases da Lua e eclipses",1,"Quanto tempo dura, aproximadamente, o ciclo completo das fases da Lua?",["29,5 dias","7 dias","365 dias","24 horas"],0,"De uma lua nova \xE0 seguinte passam cerca de 29,5 dias (m\xEAs sin\xF3dico). Cada fase principal dura cerca de uma semana."],["Fases da Lua e eclipses",2,"Um eclipse solar acontece quando:",["a Lua fica entre o Sol e a Terra","a Terra fica entre o Sol e a Lua","o Sol fica entre a Terra e a Lua","a Lua est\xE1 na fase cheia"],0,"A sombra da Lua atinge uma regi\xE3o da Terra e encobre o Sol. Por isso ocorre na lua nova."],["Fases da Lua e eclipses",2,"Um eclipse lunar s\xF3 pode acontecer em qual fase?",["cheia","nova","crescente","minguante"],0,"\xC9 preciso que a Terra esteja entre o Sol e a Lua, o que ocorre na lua cheia."],["Fases da Lua e eclipses",2,"O que acontece na lua nova?",["a face iluminada da Lua est\xE1 voltada para o lado oposto ao da Terra","vemos a Lua toda iluminada","a Terra faz sombra sobre a Lua","a Lua sai de sua \xF3rbita"],0,"A Lua est\xE1 entre a Terra e o Sol, ent\xE3o quase n\xE3o vemos sua parte iluminada."],["Fases da Lua e eclipses",3,"Por que n\xE3o h\xE1 eclipses todos os meses?",["porque a \xF3rbita da Lua \xE9 inclinada em rela\xE7\xE3o \xE0 \xF3rbita da Terra","porque a Lua para de girar","porque o Sol muda de tamanho","porque as nuvens escondem os eclipses"],0,"A inclina\xE7\xE3o da \xF3rbita (cerca de 5\xB0) faz o alinhamento exato de Sol, Terra e Lua acontecer s\xF3 em algumas \xE9pocas."],["Fases da Lua e eclipses",2,"Qual \xE9 a forma segura de observar um eclipse solar?",["usar filtros pr\xF3prios e certificados, sem nunca olhar diretamente para o Sol","usar \xF3culos escuros comuns","olhar rapidamente a olho nu","usar uma radiografia"],0,"\xD3culos escuros e radiografias n\xE3o bloqueiam a radia\xE7\xE3o perigosa. Olhar para o Sol pode causar les\xF5es permanentes nos olhos."],["Clima e mudan\xE7as clim\xE1ticas",1,"Qual \xE9 a diferen\xE7a entre tempo atmosf\xE9rico e clima?",["tempo \xE9 a condi\xE7\xE3o do momento; clima \xE9 o padr\xE3o observado ao longo de muitos anos","s\xE3o a mesma coisa","o clima muda a cada hora","o tempo \xE9 medido em d\xE9cadas"],0,"\u201CHoje est\xE1 chovendo\u201D descreve o tempo. \u201COs ver\xF5es aqui s\xE3o chuvosos\u201D descreve o clima."],["Clima e mudan\xE7as clim\xE1ticas",2,"O efeito estufa natural:",["ret\xE9m parte do calor e mant\xE9m a Terra habit\xE1vel","\xE9 sempre prejudicial \xE0 vida","\xE9 causado s\xF3 pelas queimadas","resfria o planeta"],0,"Sem ele, a Terra seria gelada. O problema \xE9 a intensifica\xE7\xE3o do efeito estufa pelas atividades humanas."],["Clima e mudan\xE7as clim\xE1ticas",2,"Qual g\xE1s, liberado na queima de combust\xEDveis f\xF3sseis, \xE9 o principal respons\xE1vel pela intensifica\xE7\xE3o do efeito estufa?",["di\xF3xido de carbono (CO\u2082)","oxig\xEAnio (O\u2082)","nitrog\xEAnio (N\u2082)","h\xE9lio (He)"],0,"Carros, ind\xFAstrias e usinas a combust\xEDveis f\xF3sseis liberam grandes quantidades de CO\u2082."],["Clima e mudan\xE7as clim\xE1ticas",2,"Qual instrumento mede a press\xE3o atmosf\xE9rica?",["bar\xF4metro","term\xF4metro","pluvi\xF4metro","anem\xF4metro"],0,"Term\xF4metro mede temperatura, pluvi\xF4metro mede chuva e anem\xF4metro mede a velocidade do vento."],["Clima e mudan\xE7as clim\xE1ticas",2,"O pluvi\xF4metro mede:",["a quantidade de chuva","a velocidade do vento","a umidade do ar","a temperatura"],0,"A chuva \xE9 medida em mil\xEDmetros: 1 mm equivale a 1 litro de \xE1gua por metro quadrado."],["Clima e mudan\xE7as clim\xE1ticas",3,"Qual a\xE7\xE3o ajuda a reduzir as emiss\xF5es de gases de efeito estufa?",["usar transporte coletivo ou bicicleta","desmatar para abrir pastagens","queimar lixo","deixar luzes acesas sem necessidade"],0,"Menos carros individuais significa menos queima de combust\xEDvel. Desmatar e queimar aumentam as emiss\xF5es."]]};var ta={subject:"Hist\xF3ria",items:[["Iluminismo",1,"Em que s\xE9culo o Iluminismo (o \u201CS\xE9culo das Luzes\u201D) teve seu auge na Europa?",["XVIII","XV","XX","XII"],0,"O movimento ganhou for\xE7a nos anos 1700 e influenciou as revolu\xE7\xF5es do final daquele s\xE9culo."],["Iluminismo",2,"Qual pensador iluminista defendeu a separa\xE7\xE3o dos poderes em Executivo, Legislativo e Judici\xE1rio?",["Montesquieu","Voltaire","Adam Smith","Lu\xEDs XIV"],0,"Em \u201CO esp\xEDrito das leis\u201D (1748), Montesquieu prop\xF4s dividir o poder para evitar abusos."],["Iluminismo",2,"Quem escreveu \u201CO contrato social\u201D, obra que defende a soberania do povo?",["Jean-Jacques Rousseau","Isaac Newton","Napole\xE3o Bonaparte","Crist\xF3v\xE3o Colombo"],0,"Para Rousseau, o poder leg\xEDtimo nasce de um pacto entre os cidad\xE3os."],["Iluminismo",2,"O que as ideias iluministas criticavam?",["o absolutismo e os privil\xE9gios do clero e da nobreza","a ci\xEAncia e a raz\xE3o","a liberdade de express\xE3o","a igualdade perante a lei"],0,"Os iluministas valorizavam a raz\xE3o, a liberdade e a igualdade jur\xEDdica, contra o poder absoluto dos reis."],["Iluminismo",2,"A Enciclop\xE9dia, que reuniu e divulgou os conhecimentos da \xE9poca, foi organizada por:",["Diderot e d\u2019Alembert","Locke e Hobbes","Marx e Engels","Galileu e Kepler"],0,"Publicada na Fran\xE7a a partir de 1751, ela espalhou as ideias iluministas."],["Iluminismo",3,"O liberalismo econ\xF4mico, associado a Adam Smith, defendia:",["pouca interven\xE7\xE3o do Estado na economia","controle total do Estado sobre os pre\xE7os","o fim do com\xE9rcio","a volta do sistema feudal"],0,"Em \u201CA riqueza das na\xE7\xF5es\u201D (1776), Smith argumentou que o mercado livre favorece a prosperidade."],["Revolu\xE7\xE3o Industrial",1,"Em que pa\xEDs come\xE7ou a Revolu\xE7\xE3o Industrial, no s\xE9culo XVIII?",["Inglaterra","Brasil","Jap\xE3o","Portugal"],0,"A Inglaterra reunia capital, mat\xE9rias-primas, m\xE3o de obra e mercados para as f\xE1bricas."],["Revolu\xE7\xE3o Industrial",2,"Qual inven\xE7\xE3o \xE9 s\xEDmbolo da Primeira Revolu\xE7\xE3o Industrial?",["a m\xE1quina a vapor","o computador","o avi\xE3o","o telefone celular"],0,"A m\xE1quina a vapor, aperfei\xE7oada por James Watt, movimentou f\xE1bricas, trens e navios."],["Revolu\xE7\xE3o Industrial",2,"Qual setor foi o primeiro a se mecanizar na Revolu\xE7\xE3o Industrial?",["t\xEAxtil","automobil\xEDstico","inform\xE1tica","aeron\xE1utico"],0,"A produ\xE7\xE3o de tecidos de algod\xE3o foi a primeira a usar teares e fiadeiras mec\xE2nicas."],["Revolu\xE7\xE3o Industrial",2,"Qual foi uma consequ\xEAncia social da Revolu\xE7\xE3o Industrial?",["jornadas longas, trabalho infantil e crescimento desordenado das cidades","o fim do trabalho assalariado","a diminui\xE7\xE3o da popula\xE7\xE3o urbana","o fechamento das f\xE1bricas"],0,"Os oper\xE1rios enfrentavam condi\xE7\xF5es duras, o que levou \xE0 organiza\xE7\xE3o de sindicatos."],["Revolu\xE7\xE3o Industrial",2,"O ludismo foi:",["um movimento de trabalhadores que quebravam m\xE1quinas em protesto","um movimento art\xEDstico","um partido pol\xEDtico franc\xEAs","uma religi\xE3o inglesa"],0,"Os luditas culpavam as m\xE1quinas pelo desemprego e pelos baixos sal\xE1rios."],["Revolu\xE7\xE3o Industrial",3,"Quais fatores explicam o pioneirismo ingl\xEAs na industrializa\xE7\xE3o?",["reservas de carv\xE3o e ferro, capital acumulado e m\xE3o de obra dispon\xEDvel","a aus\xEAncia de com\xE9rcio","um territ\xF3rio sem recursos naturais","a proibi\xE7\xE3o de f\xE1bricas"],0,"O carv\xE3o alimentava as m\xE1quinas, o com\xE9rcio gerava capital, e os cercamentos expulsaram camponeses para as cidades."],["Independ\xEAncia dos Estados Unidos",1,"Qual era a metr\xF3pole das Treze Col\xF4nias da Am\xE9rica do Norte?",["Inglaterra","Espanha","Fran\xE7a","Portugal"],0,"As Treze Col\xF4nias foram fundadas por ingleses na costa leste da Am\xE9rica do Norte."],["Independ\xEAncia dos Estados Unidos",1,"Em que ano foi assinada a Declara\xE7\xE3o de Independ\xEAncia dos Estados Unidos?",["1776","1789","1822","1492"],0,"Foi assinada em 4 de julho de 1776. A guerra contra a Inglaterra continuou at\xE9 1783."],["Independ\xEAncia dos Estados Unidos",2,"O que levou os colonos a se revoltar contra a Inglaterra?",["o aumento de impostos e leis criadas sem representa\xE7\xE3o dos colonos","a descoberta de ouro","uma invas\xE3o espanhola","a aboli\xE7\xE3o da escravid\xE3o"],0,"Leis como a do Selo (1765) e a do Ch\xE1 (1773) geraram o lema \u201Cnenhuma taxa\xE7\xE3o sem representa\xE7\xE3o\u201D."],["Independ\xEAncia dos Estados Unidos",2,"A Festa do Ch\xE1 de Boston (1773) foi:",["um protesto em que colonos jogaram ao mar um carregamento de ch\xE1","uma festa oficial do rei ingl\xEAs","um tratado de paz","uma celebra\xE7\xE3o religiosa"],0,"Foi uma rea\xE7\xE3o \xE0 Lei do Ch\xE1 e aumentou a tens\xE3o com a metr\xF3pole."],["Independ\xEAncia dos Estados Unidos",2,"Quem foi o principal redator da Declara\xE7\xE3o de Independ\xEAncia dos Estados Unidos?",["Thomas Jefferson","Abraham Lincoln","Napole\xE3o Bonaparte","Sim\xF3n Bol\xEDvar"],0,"Jefferson incorporou ideias iluministas, como o direito \xE0 vida, \xE0 liberdade e \xE0 busca da felicidade."],["Independ\xEAncia dos Estados Unidos",3,"Qual foi uma contradi\xE7\xE3o da independ\xEAncia dos Estados Unidos?",["a Declara\xE7\xE3o falava em liberdade, mas a escravid\xE3o foi mantida","n\xE3o existia escravid\xE3o nas col\xF4nias","as mulheres conquistaram o voto imediatamente","os povos ind\xEDgenas receberam todas as terras"],0,"A escravid\xE3o s\xF3 foi abolida no pa\xEDs em 1865, depois da Guerra Civil."],["Revolu\xE7\xE3o Francesa",1,"Qual acontecimento de 1789 \xE9 considerado o marco inicial da Revolu\xE7\xE3o Francesa?",["a Tomada da Bastilha","a Proclama\xE7\xE3o da Rep\xFAblica no Brasil","a Independ\xEAncia dos Estados Unidos","o in\xEDcio da Revolu\xE7\xE3o Industrial"],0,"Em 14 de julho de 1789, a popula\xE7\xE3o de Paris invadiu a Bastilha, pris\xE3o que simbolizava o absolutismo."],["Revolu\xE7\xE3o Francesa",2,"Qual era o lema da Revolu\xE7\xE3o Francesa?",["Liberdade, Igualdade, Fraternidade","Ordem e Progresso","Deus, P\xE1tria e Rei","Paz, P\xE3o e Terra"],0,"O lema resume ideais iluministas. \u201COrdem e Progresso\u201D \xE9 o lema da bandeira brasileira."],["Revolu\xE7\xE3o Francesa",2,"Na Fran\xE7a antes da Revolu\xE7\xE3o, quem formava o Terceiro Estado?",["a burguesia, os camponeses e os trabalhadores urbanos","o clero","a nobreza","a fam\xEDlia real"],0,"O Terceiro Estado era a maioria da popula\xE7\xE3o e pagava impostos, enquanto clero e nobreza tinham privil\xE9gios."],["Revolu\xE7\xE3o Francesa",2,"Qual documento de 1789 afirmou que \u201Cos homens nascem e permanecem livres e iguais em direitos\u201D?",["Declara\xE7\xE3o dos Direitos do Homem e do Cidad\xE3o","Constitui\xE7\xE3o brasileira de 1824","Magna Carta","Tratado de Tordesilhas"],0,"Ela inspirou constitui\xE7\xF5es e declara\xE7\xF5es de direitos no mundo todo."],["Revolu\xE7\xE3o Francesa",2,"Quem governou durante o per\xEDodo conhecido como Terror (1793\u20131794)?",["os jacobinos, liderados por Robespierre","a nobreza, liderada por Lu\xEDs XVI","os ingleses","Napole\xE3o, j\xE1 como imperador"],0,"Os jacobinos perseguiram opositores e realizaram muitas execu\xE7\xF5es na guilhotina."],["Revolu\xE7\xE3o Francesa",3,"Qual acontecimento encerrou o ciclo revolucion\xE1rio e levou Napole\xE3o ao poder em 1799?",["o Golpe do 18 Brum\xE1rio","a Tomada da Bastilha","a Independ\xEAncia do Haiti","a Queda do Muro de Berlim"],0,"Com o golpe, Napole\xE3o tornou-se primeiro-c\xF4nsul e, em 1804, imperador."],["Independ\xEAncias na Am\xE9rica Latina",1,"Qual foi o primeiro pa\xEDs da Am\xE9rica Latina a se tornar independente, em 1804?",["Haiti","Brasil","Argentina","M\xE9xico"],0,"A independ\xEAncia do Haiti resultou de uma revolu\xE7\xE3o de pessoas escravizadas contra a Fran\xE7a."],["Independ\xEAncias na Am\xE9rica Latina",2,"Quem liderou lutas de independ\xEAncia na Venezuela, Col\xF4mbia, Equador, Peru e Bol\xEDvia e ficou conhecido como \u201CLibertador\u201D?",["Sim\xF3n Bol\xEDvar","Dom Pedro I","George Washington","Tiradentes"],0,"Bol\xEDvar sonhava unir a Am\xE9rica do Sul, mas as antigas col\xF4nias formaram v\xE1rios pa\xEDses."],["Independ\xEAncias na Am\xE9rica Latina",2,"Quem eram os criollos na Am\xE9rica espanhola?",["descendentes de espanh\xF3is nascidos na Am\xE9rica","espanh\xF3is nascidos na Espanha","ind\xEDgenas","africanos escravizados"],0,"Os criollos eram ricos, mas exclu\xEDdos dos altos cargos, reservados aos chapetones (nascidos na Espanha). Por isso lideraram as independ\xEAncias."],["Independ\xEAncias na Am\xE9rica Latina",2,"Qual acontecimento europeu enfraqueceu a Espanha e favoreceu as independ\xEAncias de suas col\xF4nias?",["a invas\xE3o da Espanha por Napole\xE3o, em 1808","a Revolu\xE7\xE3o Russa","a Primeira Guerra Mundial","a descoberta do petr\xF3leo"],0,"Com o rei espanhol afastado, as elites coloniais formaram juntas de governo e depois romperam com a metr\xF3pole."],["Independ\xEAncias na Am\xE9rica Latina",2,"De qual pa\xEDs europeu o Haiti era col\xF4nia (com o nome de Saint-Domingue)?",["Fran\xE7a","Espanha","Portugal","Inglaterra"],0,"Saint-Domingue era a col\xF4nia mais lucrativa da Fran\xE7a, com produ\xE7\xE3o de a\xE7\xFAcar baseada no trabalho escravizado."],["Independ\xEAncias na Am\xE9rica Latina",3,"O que aconteceu com a Am\xE9rica espanhola ap\xF3s as independ\xEAncias?",["fragmentou-se em v\xE1rios pa\xEDses, apesar do projeto de uni\xE3o de Bol\xEDvar","formou um \xFAnico grande pa\xEDs","voltou a ser col\xF4nia da Espanha","uniu-se ao Brasil em uma monarquia"],0,"Interesses regionais das elites levaram \xE0 forma\xE7\xE3o de diversas rep\xFAblicas."],["Brasil no s\xE9culo XIX e per\xEDodo regencial",1,"Em que ano o Brasil declarou sua independ\xEAncia de Portugal?",["1822","1500","1888","1889"],0,"Em 7 de setembro de 1822. D. Pedro I tornou-se o primeiro imperador."],["Brasil no s\xE9culo XIX e per\xEDodo regencial",2,"Qual foi a dura\xE7\xE3o do per\xEDodo regencial?",["de 1831, com a abdica\xE7\xE3o de D. Pedro I, at\xE9 1840, com o Golpe da Maioridade","de 1500 a 1530","de 1889 a 1930","de 1964 a 1985"],0,"Foi um intervalo de cerca de nove anos, marcado por revoltas em v\xE1rias prov\xEDncias."],["Brasil no s\xE9culo XIX e per\xEDodo regencial",2,"Por que o Brasil foi governado por regentes entre 1831 e 1840?",["porque D. Pedro II ainda era crian\xE7a quando o pai abdicou","porque o Brasil virou rep\xFAblica","porque D. Pedro I morreu em uma guerra","porque Portugal nomeou governadores"],0,"D. Pedro II tinha 5 anos em 1831. A Constitui\xE7\xE3o exigia regentes at\xE9 a maioridade dele."],["Brasil no s\xE9culo XIX e per\xEDodo regencial",2,"Qual revolta, liderada por estancieiros no Rio Grande do Sul, durou de 1835 a 1845?",["Farroupilha","Cabanagem","Balaiada","Sabinada"],0,"A Guerra dos Farrapos foi a mais longa revolta do per\xEDodo e chegou a proclamar uma rep\xFAblica."],["Brasil no s\xE9culo XIX e per\xEDodo regencial",2,"Em que prov\xEDncia ocorreu a Cabanagem (1835\u20131840)?",["Gr\xE3o-Par\xE1","Bahia","Maranh\xE3o","S\xE3o Paulo"],0,"A Cabanagem teve grande participa\xE7\xE3o de ind\xEDgenas, negros e mesti\xE7os pobres (os \u201Ccabanos\u201D)."],["Brasil no s\xE9culo XIX e per\xEDodo regencial",3,"A Constitui\xE7\xE3o de 1824 criou um quarto poder, exclusivo do imperador. Qual?",["o Poder Moderador","o Poder Eleitoral","o Poder Popular","o Poder Militar"],0,"Com o Poder Moderador, o imperador podia intervir nos outros poderes, o que concentrava a autoridade."],["Escravid\xE3o, resist\xEAncias e aboli\xE7\xE3o",1,"Em que ano foi assinada a Lei \xC1urea, que aboliu a escravid\xE3o no Brasil?",["1888","1822","1850","1871"],0,"Assinada em 13 de maio de 1888, fez do Brasil o \xFAltimo pa\xEDs das Am\xE9ricas a abolir a escravid\xE3o."],["Escravid\xE3o, resist\xEAncias e aboli\xE7\xE3o",2,"Qual foi o maior e mais conhecido quilombo do Brasil colonial, que teve Zumbi como l\xEDder?",["Palmares","Canudos","Contestado","Farroupilha"],0,"Palmares, na Serra da Barriga (atual Alagoas), resistiu por quase um s\xE9culo. O 20 de novembro, Dia da Consci\xEAncia Negra, lembra Zumbi."],["Escravid\xE3o, resist\xEAncias e aboli\xE7\xE3o",2,"O que determinou a Lei Eus\xE9bio de Queir\xF3s, de 1850?",["a proibi\xE7\xE3o do tr\xE1fico de africanos escravizados para o Brasil","a aboli\xE7\xE3o da escravid\xE3o","a liberta\xE7\xE3o dos idosos","a liberta\xE7\xE3o dos filhos de mulheres escravizadas"],0,"O tr\xE1fico foi proibido, mas a escravid\xE3o continuou existindo no pa\xEDs."],["Escravid\xE3o, resist\xEAncias e aboli\xE7\xE3o",2,"O que estabeleceu a Lei do Ventre Livre, de 1871?",["que os filhos de mulheres escravizadas nascidos a partir dela seriam livres","a aboli\xE7\xE3o imediata da escravid\xE3o","a proibi\xE7\xE3o do tr\xE1fico negreiro","a liberta\xE7\xE3o dos maiores de 60 anos"],0,"Na pr\xE1tica, muitas dessas crian\xE7as continuaram sob controle dos senhores at\xE9 os 21 anos."],["Escravid\xE3o, resist\xEAncias e aboli\xE7\xE3o",2,"Quais foram formas de resist\xEAncia das pessoas escravizadas?",["fugas, forma\xE7\xE3o de quilombos, revoltas e preserva\xE7\xE3o das culturas africanas","nenhuma, pois aceitavam a escravid\xE3o","apenas pedidos ao rei","somente greves em f\xE1bricas"],0,"A resist\xEAncia foi constante: revoltas como a dos Mal\xEAs (1835), quilombos, irmandades e a manuten\xE7\xE3o de religi\xF5es e costumes."],["Escravid\xE3o, resist\xEAncias e aboli\xE7\xE3o",3,"Qual foi um problema enfrentado pela popula\xE7\xE3o negra logo ap\xF3s a aboli\xE7\xE3o?",["os libertos n\xE3o receberam terras, indeniza\xE7\xE3o nem pol\xEDticas de integra\xE7\xE3o","todos receberam terras do governo","os ex-escravizados foram indenizados","o racismo deixou de existir"],0,"Sem apoio, muitos ficaram em condi\xE7\xF5es prec\xE1rias, e as desigualdades raciais persistem at\xE9 hoje."]]};var na={subject:"Geografia",items:[["Din\xE2mica populacional e migra\xE7\xF5es",1,"O crescimento vegetativo (ou natural) de uma popula\xE7\xE3o \xE9 a diferen\xE7a entre:",["a taxa de natalidade e a taxa de mortalidade","a imigra\xE7\xE3o e a emigra\xE7\xE3o","a popula\xE7\xE3o urbana e a rural","homens e mulheres"],0,"O crescimento vegetativo n\xE3o inclui migra\xE7\xF5es. Somando as migra\xE7\xF5es, obt\xE9m-se o crescimento total."],["Din clima","o fuso hor\xE1rio"],0,"A Am\xE9rica Latina foi colonizada principalmente por espanh\xF3is e portugueses, que trouxeram l\xEDnguas de origem latina."],["Am\xE9rica Latina e regionaliza\xE7\xF5es",2,"Qual pa\xEDs da Am\xE9rica do Norte faz parte da Am\xE9rica Latina?",["M\xE9xico","Canad\xE1","Estados Unidos","Groenl\xE2ndia"],0,"Pelo crit\xE9rio f\xEDsico, o M\xE9xico est\xE1 na Am\xE9rica do Norte. Pelo crit\xE9rio hist\xF3rico-cultural, est\xE1 na Am\xE9rica Latina."],["Am\xE9rica Latina e regionaliza\xE7\xF5es",2,"Quais s\xE3o as l\xEDnguas predominantes na Am\xE9rica Latina?",["espanhol e portugu\xEAs","ingl\xEAs e alem\xE3o","franc\xEAs e russo","chin\xEAs e japon\xEAs"],0,"Tamb\xE9m h\xE1 muitas l\xEDnguas ind\xEDgenas, como o qu\xE9chua e o guarani, al\xE9m do franc\xEAs no Haiti."],["Am\xE9rica Latina e regionaliza\xE7\xF5es",2,"Qual canal liga o Oceano Atl\xE2ntico ao Oceano Pac\xEDfico pela Am\xE9rica Central?",["Canal do Panam\xE1","Canal de Suez","Estreito de Gibraltar","Canal da Mancha"],0,"O Canal do Panam\xE1 encurta muito as rotas mar\xEDtimas. O de Suez liga o Mediterr\xE2neo ao Mar Vermelho."],["Am\xE9rica Latina e regionaliza\xE7\xF5es",2,"O Mercosul \xE9:",["um bloco econ\xF4mico sul-americano","uma organiza\xE7\xE3o militar","uma moeda \xFAnica para toda a Am\xE9rica","um acordo apenas entre Estados Unidos e Canad\xE1"],0,"Foi criado em 1991 por Brasil, Argentina, Paraguai e Uruguai para facilitar o com\xE9rcio entre eles."],["Am\xE9rica Latina e regionaliza\xE7\xF5es",3,"Onde fica a Cordilheira dos Andes?",["no oeste da Am\xE9rica do Sul","no leste do Brasil","no Caribe","apenas na Am\xE9rica Central"],0,"Ela acompanha a costa do Pac\xEDfico, da Venezuela ao sul do Chile e da Argentina."],["\xC1frica e diversidade territorial",1,"Qual \xE9 o maior deserto quente do mundo, localizado no norte da \xC1frica?",["Saara","Atacama","Gobi","Kalahari"],0,"O Saara ocupa boa parte do norte africano. O Kalahari fica no sul do continente."],["\xC1frica e diversidade territorial",2,"Qual \xE9 o rio mais extenso da \xC1frica?",["Nilo","Congo","N\xEDger","Amazonas"],0,"O Nilo atravessa v\xE1rios pa\xEDses at\xE9 o Mediterr\xE2neo e foi essencial para a civiliza\xE7\xE3o eg\xEDpcia."],["\xC1frica e diversidade territorial",2,"Em que encontro as pot\xEAncias europeias dividiram o territ\xF3rio africano entre si?",["na Confer\xEAncia de Berlim, em 1884\u20131885","no Tratado de Tordesilhas","no Congresso de Viena","na Confer\xEAncia de Yalta"],0,"As fronteiras foram tra\xE7adas sem considerar os povos que viviam em cada regi\xE3o."],["\xC1frica e diversidade territorial",2,"Uma regionaliza\xE7\xE3o comum do continente africano o divide em:",["\xC1frica do Norte (Setentrional) e \xC1frica Subsaariana","\xC1frica Latina e \xC1frica Anglo-Sax\xF4nica","Oriente e Ocidente apenas","\xC1frica Tropical e \xC1frica Polar"],0,"O Saara funciona como divisor entre o norte, de maioria \xE1rabe e isl\xE2mica, e a por\xE7\xE3o subsaariana, de grande diversidade \xE9tnica."],["\xC1frica e diversidade territorial",2,"Qual foi uma consequ\xEAncia das fronteiras impostas pelos colonizadores europeus?",["conflitos entre povos separados ou reunidos \xE0 for\xE7a","a aus\xEAncia total de conflitos","o fim da diversidade \xE9tnica","a unifica\xE7\xE3o de todas as l\xEDnguas"],0,"Grupos rivais ficaram no mesmo pa\xEDs, e povos com la\xE7os hist\xF3ricos foram separados, o que gerou tens\xF5es duradouras."],["\xC1frica e diversidade territorial",3,"Em que pa\xEDs vigorou o apartheid, regime de segrega\xE7\xE3o racial que terminou nos anos 1990?",["\xC1frica do Sul","Egito","Nig\xE9ria","Marrocos"],0,"Nelson Mandela, preso por 27 anos, tornou-se presidente em 1994, ap\xF3s o fim do apartheid."],["Urbaniza\xE7\xE3o e desigualdades",1,"O que \xE9 urbaniza\xE7\xE3o?",["o aumento da popula\xE7\xE3o urbana em rela\xE7\xE3o \xE0 rural","o aumento da popula\xE7\xE3o rural","o crescimento das florestas","a diminui\xE7\xE3o das cidades"],0,"Hoje a maior parte da popula\xE7\xE3o brasileira vive em \xE1reas urbanas."],["Urbaniza\xE7\xE3o e desigualdades",2,"O que \xE9 uma metr\xF3pole?",["uma cidade principal que concentra servi\xE7os e influencia uma grande regi\xE3o","qualquer vila pequena","uma zona rural","uma cidade abandonada"],0,"S\xE3o Paulo, Rio de Janeiro e Buenos Aires s\xE3o exemplos de metr\xF3poles latino-americanas."],["Urbaniza\xE7\xE3o e desigualdades",2,"A conurba\xE7\xE3o \xE9:",["a jun\xE7\xE3o das \xE1reas urbanas de cidades vizinhas","a separa\xE7\xE3o de bairros","a sa\xEDda de moradores das cidades","a cria\xE7\xE3o de parques"],0,"Com o crescimento, os limites entre os munic\xEDpios deixam de ser percebidos na paisagem."],["Urbaniza\xE7\xE3o e desigualdades",2,"Qual problema urbano est\xE1 ligado \xE0 desigualdade social?",["moradias prec\xE1rias em \xE1reas de risco","excesso de \xE1reas verdes","falta de carros","poucos moradores"],0,"Sem acesso \xE0 moradia digna, muitas fam\xEDlias vivem em encostas ou margens de rios, sujeitas a desastres."],["Urbaniza\xE7\xE3o e desigualdades",2,"Como a ONU costuma chamar uma cidade com mais de 10 milh\xF5es de habitantes?",["megacidade","vila","povoado","cidade m\xE9dia"],0,"S\xE3o Paulo, Cidade do M\xE9xico e Buenos Aires est\xE3o entre as megacidades da Am\xE9rica Latina."],["Urbaniza\xE7\xE3o e desigualdades",3,"Qual medida favorece a mobilidade urbana sustent\xE1vel?",["priorizar transporte coletivo, ciclovias e cal\xE7adas","ampliar s\xF3 as vias para carros","proibir \xF4nibus","eliminar cal\xE7adas"],0,"Transporte coletivo e ativo reduz congestionamentos, polui\xE7\xE3o e emiss\xF5es."],["Globaliza\xE7\xE3o e fluxos",1,"A globaliza\xE7\xE3o pode ser entendida como:",["a integra\xE7\xE3o econ\xF4mica, cultural e de comunica\xE7\xE3o entre os pa\xEDses","o isolamento dos pa\xEDses","o fim do com\xE9rcio","a volta ao feudalismo"],0,"Ela se intensificou a partir do fim do s\xE9culo XX, com novas tecnologias de transporte e comunica\xE7\xE3o."],[
