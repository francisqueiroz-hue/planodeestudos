<title>Painel de Estudos</title>
<meta name="description" content="Plataforma pessoal de estudos do 8º ano com foco em Matemática.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Visual único e escuro, escolhido de propósito: cores definidas explicitamente para qualquer tema do visualizador. */
:root{color-scheme:dark;--bg:#0b0c10;--surface:#15161c;--tile:#1d1f27;--tile-hi:#262833;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);--text:#f2f3f7;--dim:#9295a4;--accent:#6d7bff;--accent-2:#a797ff;--ok:#6fdca0;--bad:#ff8b97;--warn:#f1cc72;--font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
a{color:var(--accent-2);text-decoration:none}a:hover{text-decoration:underline}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,12,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}.brand b{display:block;font-size:17px;letter-spacing:-.02em}.brand small{color:var(--dim);font-size:12px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-2));font-weight:800;font-size:18px}
.score{text-align:right}.score b{font-family:var(--mono);font-size:16px}.score small{display:block;color:var(--dim);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs button{flex:none;border:1px solid transparent;background:none;color:var(--dim);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--text);color:var(--bg)}.tabs button:hover:not(.on){color:var(--text);border-color:var(--line-2)}
main{display:flex;flex-direction:column;gap:18px;padding-top:22px}
.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.08;letter-spacing:-.035em;margin:0;text-wrap:balance}
.dim{color:var(--dim)}.hero .lead{color:var(--dim);font-size:16px;max-width:62ch;margin:8px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:24px;font-variant-numeric:tabular-nums}.stat span{color:var(--dim);font-size:13px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.actions,.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.center{justify-content:center}
.primary,.secondary,.ghost{border-radius:999px;font-weight:700;padding:11px 20px;border:1px solid transparent}
.primary{background:var(--text);color:var(--bg)}.secondary{background:var(--tile-hi);border-color:var(--line-2)}.ghost{background:none;border-color:var(--line-2);color:var(--dim)}
.small{padding:7px 14px;font-size:13px}.small-link{font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.center{align-items:center;text-align:center;padding:28px 20px}
.card h2{margin:0;font-size:22px;letter-spacing:-.02em}.card h3{margin:0;font-size:17px;letter-spacing:-.01em}
.topic .dim{font-size:13px;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.meter{height:6px;border-radius:9px;background:var(--tile-hi);overflow:hidden}.meter div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:9px}
.q{gap:12px}.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
.lvl,.tag{border-radius:999px;padding:2px 9px;border:1px solid var(--line-2);font-size:11px}.lvl.l1{color:var(--ok)}.lvl.l2{color:var(--warn)}.lvl.l3{color:var(--bad)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.prompt{margin:0;font-size:17px;font-weight:600;line-height:1.45}.prompt.big{font-size:clamp(18px,2.4vw,22px);text-align:center}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--line-2);background:#101117;line-height:1.4}
.opt:hover:not(:disabled){border-color:rgba(167,151,255,.6)}.opt:disabled{opacity:1;cursor:default}
.opt.on{border-color:var(--accent-2);background:rgba(167,151,255,.12)}.opt.right{border-color:var(--ok);background:rgba(111,220,160,.12)}.opt.wrong{border-color:var(--bad);background:rgba(255,139,151,.1)}
.l{flex:none;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--tile-hi);font-family:var(--mono);font-size:12px}
.opt.on .l{background:var(--accent-2);color:var(--bg)}.opt.right .l{background:var(--ok);color:var(--bg)}.opt.wrong .l{background:var(--bad);color:var(--bg)}
.q>.primary{align-self:flex-start}
.feedback{display:grid;gap:8px;padding:14px;border-radius:16px;background:var(--tile);border:1px solid var(--line)}.feedback p{margin:0}
.ok{color:var(--ok)}.bad{color:var(--bad)}.feedback .ok,.feedback .bad{color:var(--text)}.feedback .ok b{color:var(--ok)}.feedback .bad b{color:var(--bad)}
.feedback>button{justify-self:start}
.explain-wrap{display:grid;gap:8px}.explain{white-space:pre-wrap;color:#d6d8e3;font-size:14px;line-height:1.55}.explain:empty{display:none}
.links{display:grid;gap:4px;font-size:13px}
.runner{max-width:680px;width:100%;align-self:center;gap:14px}.run-top{display:flex;justify-content:space-between;gap:8px}
.runner>.primary{align-self:center}
.field-label{display:grid;gap:6px;font-size:13px;color:var(--dim);text-align:left}
select,textarea{background:#101117;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;max-width:100%}
textarea{width:100%;resize:vertical}
.filters select{flex:1 1 180px}
.stack{display:flex;flex-direction:column;gap:14px}.stack>.ghost{align-self:center}
.empty{color:var(--dim);text-align:center;padding:30px;border:1px dashed var(--line-2);border-radius:18px;margin:0}
.results{list-style:none;padding:0;margin:0;display:grid;gap:8px;width:100%;text-align:left}
.results li{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--tile);border-left:3px solid var(--bad);font-size:14px}.results li.ok{border-color:var(--ok);color:var(--text)}.results li.bad{color:var(--text)}.results span{color:var(--dim)}
.bims{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bim{display:grid;gap:8px;align-content:start;background:var(--tile);border-radius:16px;padding:12px}
.bim h3{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ptopic{display:grid;gap:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.03)}
.ptopic label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.ptopic input{margin-top:4px;accent-color:var(--accent-2)}
.ptopic.done b{text-decoration:line-through;color:var(--dim)}
.ptopic details{font-size:13px}.ptopic summary{cursor:pointer;color:var(--accent-2)}.ptopic details p{margin:6px 0}
.others>summary{cursor:pointer;font-weight:700;font-size:18px}.others{gap:14px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow-y:auto}
.bubble{max-width:85%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;line-height:1.5;background:var(--tile)}.bubble.user{align-self:flex-end;background:#3a3f9e}
footer{margin-top:28px;color:var(--dim);font-size:12px;text-align:center}
#sync[data-state="erro"]{color:var(--warn)}
.backup>summary{cursor:pointer;font-weight:700}.backup textarea{font-family:var(--mono);font-size:12px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div id="app"></div>
<script>/*APP*/</script>
